<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Страница не найдена — «Пифагор»</title>
  <meta name="robots" content="noindex">
  <link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400&family=Jost:wght@400;500&display=swap" rel="stylesheet">
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; text-align: center; padding: 24px; box-sizing: border-box; font-family: "Jost", sans-serif; color: #fff;
      background: radial-gradient(900px 500px at 70% 20%, rgba(64,168,197,.55), transparent 60%), linear-gradient(120deg, #133f66, #1a547e 45%, #2a79a6); }
    h1 { font-family: "Unbounded", sans-serif; font-weight: 400; font-size: clamp(64px, 14vw, 140px); letter-spacing: -.06em; margin: 0; color: #f9ab01; line-height: 1; }
    p { font-size: 20px; margin: 16px 0 28px; }
    a { display: inline-block; background: #f9ab01; color: #fff; text-decoration: none; padding: 16px 28px; border-radius: 10px; font-size: 18px; }
  </style>
</head>
<body>
  <div>
    <h1>404</h1>
    <p>a² + b² ≠ эта страница. Похоже, ссылка устарела.</p>
    <a id="home" href="/">Смотреть вакансии</a>
  </div>
  <script>
    // корректная ссылка «домой» и для project-pages (/repo/…)
    var seg = location.pathname.split("/").filter(Boolean)[0];
    if (location.hostname.indexOf("github.io") !== -1 && seg) document.getElementById("home").href = "/" + seg + "/";
  </script>
</body>
</html>
